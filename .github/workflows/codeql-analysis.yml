name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'swift'

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      contents: write
      security-events: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # ios/Configurations/*.xcconfig are gitignored, so the xcodeproj cannot open
      # its base configuration references and every iOS target is skipped. Without
      # these, autobuild silently built only WireGuardKit from the submodule: 12
      # Swift compilations out of ~1,100 files, green run, empty database.
      - name: Materialise xcconfig from templates
        run: |
          for t in ios/Configurations/*.xcconfig.template; do
            cp "$t" "${t%.template}"
          done

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ github.event.inputs.languages || 'swift' }}
          build-mode: manual

      - name: Build
        run: |
          xcodebuild build \
            -project ios/MullvadVPN.xcodeproj \
            -scheme MullvadVPN \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ github.event.inputs.languages || 'swift' }}"