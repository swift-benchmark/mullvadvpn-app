name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'swift'

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      contents: write
      security-events: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      # ios/Configurations/*.xcconfig are gitignored, so the xcodeproj cannot open
      # its base configuration references and every iOS target is skipped. Without
      # these, autobuild silently built only WireGuardKit from the submodule: 12
      # Swift compilations out of ~1,100 files, green run, empty database.
      - name: Materialise xcconfig from templates
        run: |
          for t in ios/Configurations/*.xcconfig.template; do
            cp "$t" "${t%.template}"
          done

      # The MullvadVPN scheme builds WireGuardGoBridge, an external build tool
      # target. Its Makefile starts with `[ -n "$(shell go env GOROOT)" ]` and
      # that came back empty, so the whole build stopped after 4 Swift
      # compilations. Pin 1.21 to match go.mod's `toolchain go1.21.10`: the
      # Makefile rsyncs the real GOROOT and applies
      # goruntime-boottime-over-monotonic.diff to it, and that patch is tied to
      # the runtime it was written against.
      - name: Install Go for the WireGuard bridge
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ github.event.inputs.languages || 'swift' }}
          build-mode: manual

      - name: Build
        run: |
          xcodebuild build \
            -project ios/MullvadVPN.xcodeproj \
            -scheme MullvadVPN \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ github.event.inputs.languages || 'swift' }}"